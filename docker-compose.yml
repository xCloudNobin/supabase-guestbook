services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8104:3000"
    environment:
      SUPABASE_URL: http://api:8000
      SUPABASE_ANON_KEY: internal-compose-network
      SUPABASE_INTERNAL_NO_AUTH: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: guestbook-internal-compose-only
    volumes:
      - supabase_db_v3:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/99-guestbook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://supabase_admin:guestbook-internal-compose-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./supabase/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # `postgrest --ready` cannot be the healthcheck: it needs server-host=localhost, which would
    # stop nginx reaching PostgREST. The api healthcheck below proves the whole path instead
    # (nginx -> PostgREST -> Postgres), so `rest` only has to have started.
    depends_on:
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/rest/v1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supabase_db_v3:
